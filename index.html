// ---------------- Firestore live collection hook ----------------
function useFirestoreList(collectionName) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const unsub = db.collection(collectionName).onSnapshot(
      (snap) => {
        setList(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
        setError(null);
      },
      (err) => { setError(String(err && err.message || err)); setLoading(false); }
    );
    return unsub;
    // eslint-disable-next-line
  }, [collectionName]);

  const add = (data) => db.collection(collectionName).add(data);
  const update = (id, data) => db.collection(collectionName).doc(id).update(data);
  const remove = (id) => db.collection(collectionName).doc(id).delete();
  const replaceAll = async (rows) => {
    const snap = await db.collection(collectionName).get();
    let batch = db.batch();
    let ops = 0;
    for (const docSnap of snap.docs) {
      batch.delete(docSnap.ref);
      ops++;
      if (ops >= 400) { await batch.commit(); batch = db.batch(); ops = 0; }
    }
    for (const row of rows) {
      batch.set(db.collection(collectionName).doc(), row);
      ops++;
      if (ops >= 400) { await batch.commit(); batch = db.batch(); ops = 0; }
    }
    if (ops > 0) await batch.commit();
  };

  return { list, loading, error, add, update, remove, replaceAll };
}

const fmtDate = (iso) => {
  if (!iso) return "—";
  const parts = String(iso).split("-");
  if (parts.length === 3) {
    const [, m, d] = parts;
    const dayNum = parseInt(d, 10);
    const monthName = MESES_NOMES[parseInt(m, 10) - 1];
    return monthName ? `${dayNum} ${monthName}` : iso;
  }
  return iso;
};

// ---------------- Simple SVG bar chart (no external chart lib) ----------------
function SimpleBarChart({ data, color = NAVY, height = 300 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  const W = 900, H = height, padL = 56, padB = 74, padT = 24, padR = 16;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const gap = data.length ? plotW / data.length : plotW;
  const barW = Math.min(64, gap * 0.55);
  const gridLines = 4;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} preserveAspectRatio="xMidYMid meet">
      {Array.from({ length: gridLines + 1 }).map((_, i) => {
        const y = padT + plotH - (i / gridLines) * plotH;
        const val = Math.round((max * i) / gridLines);
        return (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="#E7ECF3" strokeWidth="1" />
            <text x={padL - 10} y={y + 4} fontSize="12" fill="#64748B" textAnchor="end">{val.toLocaleString("pt-BR")}</text>
          </g>
        );
      })}
      <line x1={padL} x2={padL} y1={padT} y2={padT + plotH} stroke="#CBD5E1" strokeWidth="1" />
      {data.map((d, i) => {
        const x = padL + gap * i + (gap - barW) / 2;
        const h = max > 0 ? (d.value / max) * plotH : 0;
        const y = padT + plotH - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={Math.max(0, h)} fill={color} rx="4" />
            <text x={x + barW / 2} y={y - 8} fontSize="12" fontWeight="600" fill="#1E293B" textAnchor="middle">{Math.round(d.value).toLocaleString("pt-BR")}</text>
            <text x={x + barW / 2} y={padT + plotH + 20} fontSize="12" fill="#475569" textAnchor="middle"
              transform={`rotate(-22 ${x + barW / 2} ${padT + plotH + 20})`}>{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// ---------------- Derived stock engine ----------------
function useEstoqueEngine(baseCombos, pedidosList, entradasList, saidasList, caixasTotal) {
  return useMemo(() => {
    const pedidoMap = {};
    pedidosList.forEach((r) => {
      const k = key(r.material, r.modelo);
      pedidoMap[k] = (pedidoMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const recebidoMap = {};
    entradasList.forEach((r) => {
      const k = key(r.material, r.modelo);
      recebidoMap[k] = (recebidoMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const saidaMap = {};
    saidasList.forEach((r) => {
      const k = key(r.material, r.modelo);
      saidaMap[k] = (saidaMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const qtdPorCaixaMap = {};
    DATA.caixas_composicao.forEach((c) => { qtdPorCaixaMap[key(c.material, c.modelo)] = c.qtd_por_caixa; });

    const rows = baseCombos.map((p) => {
      const k = key(p.material, p.modelo);
      const pedido = pedidoMap[k] || 0;
      const recebido = recebidoMap[k] || 0;
      const saidaAvulsa = saidaMap[k] || 0;
      const qtdPorCaixa = qtdPorCaixaMap[k] || 0;
      const saidaCaixas = qtdPorCaixa * caixasTotal;
      const disponivel = recebido - saidaAvulsa - saidaCaixas;
      return { ...p, pedido, recebido, saidaAvulsa, saidaCaixas, disponivel, qtdPorCaixa };
    });

    const byKey = {};
    rows.forEach((r) => { byKey[key(r.material, r.modelo)] = r; });

    const materiaisTotais = DATA.materiaisOrdem.map((m) => {
      const items = rows.filter((r) => r.material === m);
      return {
        material: m,
        pedido: items.reduce((a, r) => a + (r.pedido || 0), 0),
        entregue: items.reduce((a, r) => a + (r.recebido || 0), 0),
        estoque: items.reduce((a, r) => a + (r.disponivel || 0), 0),
      };
    });

    return { rows, byKey, materiaisTotais };
  }, [baseCombos, pedidosList, entradasList, saidasList, caixasTotal]);
}

    let base = list.filter((r) => {

    if (fModelo !== "Todos") base = base.filter((r) => r.modelo === fModelo);
    if (fGrafica !== "Todas") base = base.filter((r) => r.grafica === fGrafica);
    if (fData !== "Todas") base = base.filter((r) => rowDateLabel(r) === fData);
    if (fQtdMin !== "") base = base.filter((r) => (Number(r.quantidade) || 0) >= Number(fQtdMin));
    if (fQtdMax !== "") base = base.filter((r) => (Number(r.quantidade) || 0) <= Number(fQtdMax));
    if (mode === "entrada" || mode === "saida") {
      return [...base].sort((a, b) => saidaDateValue(b) - saidaDateValue(a));
    }
    return base;
  }, [list, q, fTipo, fModelo, fGrafica, fData, fQtdMin, fQtdMax, mode]);

  const limparFiltros = () => { setQ(""); setFTipo("Todos"); setFModelo("Todos"); setFGrafica("Todas"); setFData("Todas"); setFQtdMin(""); setFQtdMax(""); };

  const addRow = (form) => { onAdd(form); setShowForm(false); };
  const saveEdit = (form) => { onUpdate(editing.id, form); setEditing(null); };
  const removeRow = (id) => { if (confirm("Excluir este registro?")) onDelete(id); };

  const addLabel = mode === "entrada" ? "Nova Entrada" : mode === "pedido" ? "Novo Pedido" : "Nova Saída";
  const modalTitle = mode === "entrada" ? "Nova Entrada de Material" : mode === "pedido" ? "Novo Pedido à Gráfica" : "Nova Saída de Material";

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, marginBottom: 10 }}>

        <select className="input" style={{ width: "auto", maxWidth: 220 }} value={fModelo} onChange={(e) => setFModelo(e.target.value)}>
          <option>Todos</option>{modelosDisponiveis.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
        <select className="input" style={{ width: "auto" }} value={fGrafica} onChange={(e) => setFGrafica(e.target.value)}>
          <option>Todas</option>{graficasDisponiveis.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
        {mode !== "pedido" && (
          <select className="input" style={{ width: "auto" }} value={fData} onChange={(e) => setFData(e.target.value)}>
            <option>Todas</option>{datasDisponiveis.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <input type="number" placeholder="Qtd mín" className="input" style={{ width: 90 }} value={fQtdMin} onChange={(e) => setFQtdMin(e.target.value)} />
          <span style={{ color: "#94A3B8", fontSize: 12 }}>–</span>
          <input type="number" placeholder="Qtd máx" className="input" style={{ width: 90 }} value={fQtdMax} onChange={(e) => setFQtdMax(e.target.value)} />
        </div>
        <div style={{ position: "relative" }}>
          <span style={{ position: "absolute", left: 10, top: 9, color: "#94A3B8" }}><Icon name="search" size={14} /></span>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={mode === "saida" ? "Buscar destino..." : "Buscar observação..."} className="input" style={{ paddingLeft: 32, width: 180 }} />
        </div>
        {filtrosAtivos && (
          <button onClick={limparFiltros} style={{ fontSize: 12, color: NAVY, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", padding: 0 }}>
            Limpar filtros

        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#64748B" }}>{filtered.length} de {list.length} registros</div>
        {isAdmin ? (
          <button onClick={() => setShowForm(true)} style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", fontSize: 14, fontWeight: 700, color: "#fff", borderRadius: 8, border: "none", cursor: "pointer", background: tone, boxShadow: "0 1px 2px rgba(0,0,0,0.08)" }}>

  const total = entries.reduce((a, e) => a + (Number(e.quantidade) || 0), 0);
  const add = () => { const n = Number(qtd); if (!n || n <= 0 || !data) return; onAdd({ data, quantidade: n }); setQtd(""); };

  return (
    <div style={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
      <div style={{ padding: "14px 20px", borderBottom: "1px solid #E2E8F0", display: "flex", alignItems: "center", gap: 8, background: "#F8FAFC" }}>
        <Icon name={iconName} size={15} color={tone} />
        <span style={{ fontSize: 14, fontWeight: 700, color: NAVY }}>{title}</span>
        <span style={{ marginLeft: "auto", fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: tone }}>{fmt(total)} {totalLabel}</span>
      </div>
      {isAdmin && (
        <div style={{ padding: 16, display: "flex", gap: 8, borderBottom: "1px solid #F1F5F9" }}>
          <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="input" style={{ flex: 1 }} />
          <input type="number" min="0" placeholder="Quantidade" value={qtd} onChange={(e) => setQtd(e.target.value)} className="input" style={{ flex: 1 }} />
          <button onClick={add} style={{ padding: "0 14px", fontSize: 14, fontWeight: 700, color: "#fff", borderRadius: 8, border: "none", cursor: "pointer", background: tone, flexShrink: 0 }}><Icon name="plus" size={15} /></button>
        </div>
      )}
      <div className="scroll-box" style={{ maxHeight: 256 }}>
        <table>
          <thead style={{ position: "sticky", top: 0, background: "#fff" }}><tr><Th>Data</Th><Th right>Quantidade</Th>{isAdmin && <Th></Th>}</tr></thead>

  );
}

  const composicao = DATA.caixas_composicao.map((c) => {
    const r = engine.byKey[key(c.material, c.modelo)];

        <KpiCard label="Enviadas aos Correios" value={fmt(enviadoTotal)} tone="gold" sub="total já despachado" icon="send" />
        <KpiCard label="Aguardando Envio" value={fmt(aguardandoEnvio)} tone={aguardandoEnvio < 0 ? "red" : "navy"} sub="montadas − enviadas" icon="box" />

        <DailyLog title="Registro de Montagem por Dia" tone={NAVY} iconName="box" entries={montagens} totalLabel="caixas" isAdmin={isAdmin}
          onAdd={(e) => montagensFS.add(e)}
          onDelete={(id) => { if (confirm("Excluir este lançamento?")) montagensFS.remove(id); }} />
        <DailyLog title="Caixas Enviadas aos Correios" tone={GOLD} iconName="send" entries={envios} totalLabel="caixas" isAdmin={isAdmin}
          onAdd={(e) => enviosFS.add(e)}
          onDelete={(id) => { if (confirm("Excluir este lançamento?")) enviosFS.remove(id); }} />
      </div>
      <div style={{ fontSize: 14, fontWeight: 700, color: NAVY, marginBottom: 12 }}>Composição da Caixa · Consumo por Item</div>
      <div className="scroll-box" style={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 10, maxHeight: 420, boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
        <table>
          <thead style={{ position: "sticky", top: 0, background: "#fff" }}><tr><Th>Material</Th><Th>Modelo</Th><Th right>Qtd/Caixa</Th><Th right>Estoque Disponível</Th><Th right>Caixas Possíveis com Este Item</Th></tr></thead>
          <tbody>
            {composicao.map((r, i) => {
              const possiveis = r.qtd_por_caixa > 0 ? Math.floor(r.disponivel / r.qtd_por_caixa) : null;
              const restrito = possiveis === maxAdicional;
              return (
                <tr key={i} className="row-hover" style={{ background: restrito ? "#FFFBEB" : "transparent" }}>
                  <Td>{r.material}</Td><Td>{r.modelo}</Td>
                  <Td right style={{ fontFamily: "monospace" }}>{fmt(r.qtd_por_caixa)}</Td>
                  <Td right style={{ fontFamily: "monospace", color: "#64748B" }}>{fmt(r.disponivel)}</Td>
                  <Td right style={{ fontFamily: "monospace", fontWeight: 700, color: possiveis <= 0 ? RED : NAVY }}>{possiveis === null ? "—" : fmt(possiveis)}</Td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}


const MESES_PT = { "Janeiro": 0, "Fevereiro": 1, "Março": 2, "Abril": 3, "Maio": 4, "Junho": 5, "Julho": 6, "Agosto": 7, "Setembro": 8, "Outubro": 9, "Novembro": 10, "Dezembro": 11 };
function saidaDateValue(r) {
  if (r.data) { const d = new Date(r.data + "T00:00:00"); if (!isNaN(d)) return d; }
  if (r.dia && r.mes && MESES_PT[r.mes] !== undefined) return new Date(2026, MESES_PT[r.mes], Number(r.dia));
  return new Date(2000, 0, 1); // desconhecida: trata como "antiga", antes de qualquer contagem
}

function ComiteConsumoTab({ saidas, contagensFS, isAdmin }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filtroDestino, setFiltroDestino] = useState("Todos");

  const computed = useMemo(() => {
    const grupos = {};
    contagensFS.list.forEach((c) => {
      const k = key(c.destino, key(c.material, c.modelo));
      grupos[k] = grupos[k] || { destino: c.destino, material: c.material, modelo: c.modelo, contagens: [] };
      grupos[k].contagens.push(c);
    });

    const saidasPorGrupo = {};
    saidas.forEach((s) => {
      if (!s.destino) return;
      const k = key(s.destino, key(s.material, s.modelo));
      saidasPorGrupo[k] = saidasPorGrupo[k] || [];
      saidasPorGrupo[k].push({ date: saidaDateValue(s), quantidade: Number(s.quantidade) || 0, localEvento: s.localEvento || null });
    });

    const out = [];
    Object.entries(grupos).forEach(([k, g]) => {
      const contagensOrdenadas = [...g.contagens].sort((a, b) => new Date(a.data) - new Date(b.data));
      const saidasG = saidasPorGrupo[k] || [];
      let prevDate = null, prevQtd = 0;
      contagensOrdenadas.forEach((c) => {
        const cDate = new Date(c.data + "T00:00:00");
        const saidasNoPeriodo = saidasG.filter((s) => (prevDate === null || s.date > prevDate) && s.date <= cDate);
        const recebidoPeriodo = saidasNoPeriodo.reduce((a, s) => a + s.quantidade, 0);
        const locaisNoPeriodo = [...new Set(saidasNoPeriodo.map((s) => s.localEvento).filter(Boolean))];
        const consumo = prevQtd + recebidoPeriodo - Number(c.quantidade);
        out.push({ ...c, destino: g.destino, material: g.material, modelo: g.modelo, recebidoPeriodo, locaisNoPeriodo, consumo });
        prevDate = cDate; prevQtd = Number(c.quantidade);
      });
    });
    out.sort((a, b) => (a.destino + a.material + a.modelo).localeCompare(b.destino + b.material + b.modelo) || new Date(a.data) - new Date(b.data));
    return out;
  }, [saidas, contagensFS.list]);

  const filtered = filtroDestino === "Todos" ? computed : computed.filter((r) => r.destino === filtroDestino);
  const destinosComContagem = useMemo(() => ["Todos", ...new Set(contagensFS.list.map((c) => c.destino))], [contagensFS.list]);

  const addContagem = (form) => { contagensFS.add(form); setShowForm(false); };
  const saveEdit = (form) => { contagensFS.update(editing.id, form); setEditing(null); };

function ContagemForm({ onSubmit, onCancel, initial }) {
  const [destino, setDestino] = useState(initial?.destino || DESTINOS_SAIDA[0]);
  const [material, setMaterial] = useState(initial?.material || DATA.materiaisOrdem[0]);
  const [modelo, setModelo] = useState(initial?.modelo || (DATA.materiaisModelos[DATA.materiaisOrdem[0]] || [])[0] || "");
  const [data, setData] = useState(initial?.data || todayISO());
  const [quantidade, setQuantidade] = useState(initial?.quantidade ?? "");

  const modelos = DATA.materiaisModelos[material] || [];
  const handleMaterialChange = (m) => { setMaterial(m); setModelo((DATA.materiaisModelos[m] || [])[0] || ""); };

  const submit = () => {
    if (quantidade === "" || Number(quantidade) < 0 || !data) return;
    onSubmit({ destino, material, modelo, data, quantidade: Number(quantidade) });
  };

  return (
    <div>
      <Field label="Destino">
        <select className="input" value={destino} onChange={(e) => setDestino(e.target.value)}>
          {DESTINOS_SAIDA.map((d) => <option key={d} value={d}>{d}</option>)}
        </select>
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Tipo de Material">
          <select className="input" value={material} onChange={(e) => handleMaterialChange(e.target.value)}>
            {DATA.materiaisOrdem.map((m) => <option key={m} value={m}>{m.replace("_", " ")}</option>)}
          </select>
        </Field>
        <Field label="Modelo">
          <select className="input" value={modelo} onChange={(e) => setModelo(e.target.value)}>
            {modelos.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
        </Field>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Data da Contagem">
          <input type="date" className="input" value={data} onChange={(e) => setData(e.target.value)} />
        </Field>
        <Field label="Quantidade que Sobrou (contada)">
          <input type="number" min="0" className="input" value={quantidade} onChange={(e) => setQuantidade(e.target.value)} placeholder="0" />
        </Field>
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 8 }}>
        <button className="btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn-navy" onClick={submit}>{initial ? "Salvar Alterações" : "Adicionar"}</button>
      </div>
    </div>
  );
}

function buildWorkbook(snapshot) {
  const wb = XLSX.utils.book_new();
  const sheets = {
    "Pedidos": snapshot.pedidos.map((r) => ({
      Tipo: r.material, Modelo: r.modelo, Gráfica: r.grafica, "Qtd Pedida": r.quantidade,
      Tiragem: r.tiragem, "Previsão de Entrega": r.previsaoEntrega, Observação: r.obs,
    })),
    "Entradas": snapshot.entradas.map((r) => ({
      Data: r.data, Tipo: r.material, Modelo: r.modelo, Quantidade: r.quantidade, Gráfica: r.grafica, Observação: r.obs,
    })),
    "Saídas": snapshot.saidas.map((r) => ({
      Data: r.data, Tipo: r.material, Modelo: r.modelo, Quantidade: r.quantidade, Gráfica: r.grafica, Destino: r.destino,
    })),
    "Caixas Montadas": snapshot.montagens.map((r) => ({ Data: r.data, Quantidade: r.quantidade })),
    "Enviadas aos Correios": snapshot.envios.map((r) => ({ Data: r.data, Quantidade: r.quantidade })),
  };
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ " ": "Sem lançamentos" }]);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  return wb;
}

    material: m, modelo: mo, grafica: DATA.graficaMap[key(m, mo)] || DATA.graficas[0],
  }))), []);

  const seedPedidos = () => DATA.estoque
    .filter((r) => (r.pedido || 0) > 0)
    .map((r) => ({
      material: r.material, modelo: r.modelo, quantidade: r.pedido,
      grafica: r.grafica, tiragem: null, previsaoEntrega: null, obs: "Pedido original (planilha)",
    }));
  const seedEntradas = () => DATA.entradas.map((r) => ({ ...r, grafica: DATA.graficaMap[key(r.material, r.modelo)] || null, data: null }));
  const seedSaidas = () => DATA.saidas.map((r) => ({ ...r, grafica: DATA.graficaMap[key(r.material, r.modelo)] || null }));
  const seedMontagens = () => (DATA.montagens_seed || []).map((r) => ({ data: r.data, quantidade: r.quantidade }));

  // ---- Live Firestore-backed collections ----
  const pedidosFS = useFirestoreList("pedidos");
  const entradasFS = useFirestoreList("entradas");

            </div>
          ) : (
            <button onClick={() => setShowLogin(true)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, fontSize: 12.5, fontWeight: 700, color: "#fff", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.18)", borderRadius: 7, padding: "9px 10px", cursor: "pointer" }}>
              <Icon name="card" size={13} /> Entrar como administrador
            </button>
          )}
        </div>
        <div style={{ padding: "12px 24px 16px", fontSize: 10, color: "rgba(255,255,255,0.4)" }}>
          Dados extraídos das planilhas de campanha · Eleições 2026
        </div>
      </aside>

      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={login} />}

      <main style={{ flex: 1, minWidth: 0 }}>
        <header className="header-flex" style={{ background: "#fff", borderBottom: "1px solid #E2E8F0", padding: "20px 28px", boxShadow: "0 1px 2px rgba(0,0,0,0.03)" }}>
          <div style={{ width: "100%" }}>
            <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.14em", fontWeight: 700, color: GOLD, marginBottom: 3 }}>Painel de Logística de Campanha</div>
            <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 24, color: NAVY }}>{activeLabel}</div>
          </div>
          <div className="mobile-login">
            {isAdmin ? (
              <button onClick={logout} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, color: GOLD, background: "#FFFBEB", border: `1px solid ${GOLD}55`, borderRadius: 6, padding: "5px 9px", cursor: "pointer" }}>
                <Icon name="card" size={12} color={GOLD} /> Sair
              </button>
            ) : (
              <button onClick={() => setShowLogin(true)} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, color: NAVY, background: "#F1F5F9", border: "1px solid #E2E8F0", borderRadius: 6, padding: "5px 9px", cursor: "pointer" }}>
                <Icon name="card" size={12} /> Admin
              </button>
            )}
          </div>
          <div className="mobile-nav">
            {NAV.filter((item) => !item.adminOnly || isAdmin).map((item) => (
              <button key={item.key} onClick={() => setPage(item.key)} style={{
                fontSize: 11, padding: "5px 8px", borderRadius: 6, border: `1px solid ${page === item.key ? NAVY : "#E2E8F0"}`,
                color: page === item.key ? NAVY : "#94A3B8", background: "#fff", cursor: "pointer",
              }}>{item.label.split(" ")[0]}</button>
            ))}
          </div>
        </header>
        <div style={{ padding: "40px 28px", maxWidth: 1400 }}>
          {page === "dashboard" && <DashboardMateriais engine={engine} />}
          {page === "financeiro" && <DashboardFinanceiroPage pedidos={pedidos} entradas={entradas} saldo={saldo} totalTiragens={totalTiragensPedidos} totalPedidos={totalValorPedidos} totalCaixas={totalValorCaixas} />}
          {page === "caixas" && <CaixasPage engine={engine} montagensFS={montagensFS} enviosFS={enviosFS} isAdmin={isAdmin} />}
          {page === "pedidos" && <PedidosPage pedidosFS={pedidosFS} isAdmin={isAdmin} />}
          {page === "logistica" && <LogisticaPage entradasFS={entradasFS} saidasFS={saidasFS} isAdmin={isAdmin} />}
          {page === "estoque" && <EstoquePage engine={engine} />}
          {page === "comites" && <ComitesPage saidas={saidas} contagensFS={contagensFS} isAdmin={isAdmin} />}
          {page === "dados" && isAdmin && (
            <DadosPage snapshot={{ pedidos, entradas, saidas, montagens, envios }} connError={connError} onRestoreOriginal={onRestoreOriginal} />
          )}
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

document.getElementById("loading").remove();
</script>
</body>
</html>
