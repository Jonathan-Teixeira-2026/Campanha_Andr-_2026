// ---------------- Simple SVG bar chart (no external chart lib) ----------------
function SimpleBarChart({ data, color = NAVY, height = 300 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  const W = 900, H = height, padL = 56, padB = 74, padT = 24, padR = 16;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const gap = data.length ? plotW / data.length : plotW;
  const barW = Math.min(64, gap * 0.55);
  const gridLines = 4;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} preserveAspectRatio="xMidYMid meet">
      {Array.from({ length: gridLines + 1 }).map((_, i) => {
        const y = padT + plotH - (i / gridLines) * plotH;
        const val = Math.round((max * i) / gridLines);
        return (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="#E7ECF3" strokeWidth="1" />
            <text x={padL - 10} y={y + 4} fontSize="12" fill="#64748B" textAnchor="end">{val.toLocaleString("pt-BR")}</text>
          </g>
        );
      })}
      <line x1={padL} x2={padL} y1={padT} y2={padT + plotH} stroke="#CBD5E1" strokeWidth="1" />
      {data.map((d, i) => {
        const x = padL + gap * i + (gap - barW) / 2;
        const h = max > 0 ? (d.value / max) * plotH : 0;
        const y = padT + plotH - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={Math.max(0, h)} fill={color} rx="4" />
            <text x={x + barW / 2} y={y - 8} fontSize="12" fontWeight="600" fill="#1E293B" textAnchor="middle">{Math.round(d.value).toLocaleString("pt-BR")}</text>
            <text x={x + barW / 2} y={padT + plotH + 20} fontSize="12" fill="#475569" textAnchor="middle"
              transform={`rotate(-22 ${x + barW / 2} ${padT + plotH + 20})`}>{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// ---------------- Derived stock engine ----------------
function useEstoqueEngine(baseCombos, pedidosList, entradasList, saidasList, caixasTotal) {
  return useMemo(() => {
    const pedidoMap = {};
    pedidosList.forEach((r) => {
      const k = key(r.material, r.modelo);
      pedidoMap[k] = (pedidoMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const recebidoMap = {};
    entradasList.forEach((r) => {
      const k = key(r.material, r.modelo);
      recebidoMap[k] = (recebidoMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const saidaMap = {};
    saidasList.forEach((r) => {
      const k = key(r.material, r.modelo);
      saidaMap[k] = (saidaMap[k] || 0) + (Number(r.quantidade) || 0);
    });
    const qtdPorCaixaMap = {};
    DATA.caixas_composicao.forEach((c) => { qtdPorCaixaMap[key(c.material, c.modelo)] = c.qtd_por_caixa; });

    const rows = baseCombos.map((p) => {
      const k = key(p.material, p.modelo);
      const pedido = pedidoMap[k] || 0;
      const recebido = recebidoMap[k] || 0;
      const saidaAvulsa = saidaMap[k] || 0;
      const qtdPorCaixa = qtdPorCaixaMap[k] || 0;
      const saidaCaixas = qtdPorCaixa * caixasTotal;
      const disponivel = recebido - saidaAvulsa - saidaCaixas;
      return { ...p, pedido, recebido, saidaAvulsa, saidaCaixas, disponivel, qtdPorCaixa };
    });

    const byKey = {};
    rows.forEach((r) => { byKey[key(r.material, r.modelo)] = r; });

    const materiaisTotais = DATA.materiaisOrdem.map((m) => {
      const items = rows.filter((r) => r.material === m);
      return {
        material: m,
        pedido: items.reduce((a, r) => a + (r.pedido || 0), 0),
        entregue: items.reduce((a, r) => a + (r.recebido || 0), 0),
        estoque: items.reduce((a, r) => a + (r.disponivel || 0), 0),
      };
    });

    return { rows, byKey, materiaisTotais };
  }, [baseCombos, pedidosList, entradasList, saidasList, caixasTotal]);
}

function DailyLog({ title, tone, iconName, entries, onAdd, onDelete, totalLabel, isAdmin }) {
  const [data, setData] = useState(todayISO());
  const [qtd, setQtd] = useState("");
  const total = entries.reduce((a, e) => a + (Number(e.quantidade) || 0), 0);
  const add = () => { const n = Number(qtd); if (!n || n <= 0 || !data) return; onAdd({ id: nextId(), data, quantidade: n }); setQtd(""); };

  return (
    <div style={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
      <div style={{ padding: "14px 20px", borderBottom: "1px solid #E2E8F0", display: "flex", alignItems: "center", gap: 8, background: "#F8FAFC" }}>
        <Icon name={iconName} size={15} color={tone} />
        <span style={{ fontSize: 14, fontWeight: 700, color: NAVY }}>{title}</span>
        <span style={{ marginLeft: "auto", fontFamily: "monospace", fontSize: 14, fontWeight: 700, color: tone }}>{fmt(total)} {totalLabel}</span>
      </div>
      {isAdmin && (
        <div style={{ padding: 16, display: "flex", gap: 8, borderBottom: "1px solid #F1F5F9" }}>
          <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="input" style={{ flex: 1 }} />
          <input type="number" min="0" placeholder="Quantidade" value={qtd} onChange={(e) => setQtd(e.target.value)} className="input" style={{ flex: 1 }} />
          <button onClick={add} style={{ padding: "0 14px", fontSize: 14, fontWeight: 700, color: "#fff", borderRadius: 8, border: "none", cursor: "pointer", background: tone, flexShrink: 0 }}><Icon name="plus" size={15} /></button>
        </div>
      )}
      <div className="scroll-box" style={{ maxHeight: 256 }}>
        <table>
          <thead style={{ position: "sticky", top: 0, background: "#fff" }}><tr><Th>Data</Th><Th right>Quantidade</Th>{isAdmin && <Th></Th>}</tr></thead>

                <Td right style={{ fontFamily: "monospace", fontWeight: 700, color: tone }}>{fmt(e.quantidade)}</Td>

            ))}

        </table>
      </div>
    </div>
  );
}

function CaixasPage({ engine, montagens, setMontagens, envios, setEnvios, isAdmin }) {
  const caixasTotal = montagens.reduce((a, e) => a + (Number(e.quantidade) || 0), 0);
  const enviadoTotal = envios.reduce((a, e) => a + (Number(e.quantidade) || 0), 0);
  const aguardandoEnvio = caixasTotal - enviadoTotal;

  const composicao = DATA.caixas_composicao.map((c) => {
    const r = engine.byKey[key(c.material, c.modelo)];
    return { ...c, disponivel: r ? r.disponivel : 0 };
  });
  const maxAdicional = composicao.length ? Math.min(...composicao.map((c) => c.qtd_por_caixa > 0 ? Math.floor(c.disponivel / c.qtd_por_caixa) : Infinity)) : 0;

  return (
    <div>
      <EyebrowDivider label="Caixas · Montagem de Kits" />
      <div className="grid-kpi2x2" style={{ marginBottom: 32 }}>
        <KpiCard label="Caixas Montadas" value={fmt(caixasTotal)} tone="navy" sub="total acumulado, deduzido do estoque" icon="box" />
        <KpiCard label="Máximo Adicional" value={fmt(Math.max(0, maxAdicional))} tone={maxAdicional <= 0 ? "red" : "green"} sub="possíveis com o estoque atual" icon="grid" />
        <KpiCard label="Enviadas aos Correios" value={fmt(enviadoTotal)} tone="gold" sub="total já despachado" icon="send" />
        <KpiCard label="Aguardando Envio" value={fmt(aguardandoEnvio)} tone={aguardandoEnvio < 0 ? "red" : "navy"} sub="montadas − enviadas" icon="box" />
      </div>
      <div className="grid-2col" style={{ marginBottom: 32 }}>
        <DailyLog title="Registro de Montagem por Dia" tone={NAVY} iconName="box" entries={montagens} totalLabel="caixas" isAdmin={isAdmin}
          onAdd={(e) => setMontagens((prev) => [e, ...prev])}
          onDelete={(id) => { if (confirm("Excluir este lançamento?")) setMontagens((prev) => prev.filter((x) => x.id !== id)); }} />
        <DailyLog title="Caixas Enviadas aos Correios" tone={GOLD} iconName="send" entries={envios} totalLabel="caixas" isAdmin={isAdmin}
          onAdd={(e) => setEnvios((prev) => [e, ...prev])}
          onDelete={(id) => { if (confirm("Excluir este lançamento?")) setEnvios((prev) => prev.filter((x) => x.id !== id)); }} />
      </div>
      <div style={{ fontSize: 14, fontWeight: 700, color: NAVY, marginBottom: 12 }}>Composição da Caixa · Consumo por Item</div>
      <div className="scroll-box" style={{ background: "#fff", border: "1px solid #E2E8F0", borderRadius: 10, maxHeight: 420, boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
        <table>
          <thead style={{ position: "sticky", top: 0, background: "#fff" }}><tr><Th>Material</Th><Th>Modelo</Th><Th right>Qtd/Caixa</Th><Th right>Estoque Disponível</Th><Th right>Caixas Possíveis com Este Item</Th></tr></thead>
          <tbody>
            {composicao.map((r, i) => {
              const possiveis = r.qtd_por_caixa > 0 ? Math.floor(r.disponivel / r.qtd_por_caixa) : null;
              const restrito = possiveis === maxAdicional;
              return (
                <tr key={i} className="row-hover" style={{ background: restrito ? "#FFFBEB" : "transparent" }}>
                  <Td>{r.material}</Td><Td>{r.modelo}</Td>
                  <Td right style={{ fontFamily: "monospace" }}>{fmt(r.qtd_por_caixa)}</Td>
                  <Td right style={{ fontFamily: "monospace", color: "#64748B" }}>{fmt(r.disponivel)}</Td>
                  <Td right style={{ fontFamily: "monospace", fontWeight: 700, color: possiveis <= 0 ? RED : NAVY }}>{possiveis === null ? "—" : fmt(possiveis)}</Td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function buildWorkbook(snapshot) {
  const wb = XLSX.utils.book_new();
  const sheets = {
    "Pedidos": snapshot.pedidos.map((r) => ({
      Tipo: r.material, Modelo: r.modelo, Gráfica: r.grafica, "Qtd Pedida": r.quantidade,
      Tiragem: r.tiragem, "Previsão de Entrega": r.previsaoEntrega, Observação: r.obs,
    })),
    "Entradas": snapshot.entradas.map((r) => ({
      Data: r.data, Tipo: r.material, Modelo: r.modelo, Quantidade: r.quantidade, Gráfica: r.grafica, Observação: r.obs,
    })),
    "Saídas": snapshot.saidas.map((r) => ({
      Data: r.data, Tipo: r.material, Modelo: r.modelo, Quantidade: r.quantidade, Gráfica: r.grafica, Destino: r.destino,
    })),
    "Caixas Montadas": snapshot.montagens.map((r) => ({ Data: r.data, Quantidade: r.quantidade })),
    "Enviadas aos Correios": snapshot.envios.map((r) => ({ Data: r.data, Quantidade: r.quantidade })),
  };
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ " ": "Sem lançamentos" }]);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  return wb;
}

function DadosPage({ snapshot, syncUrl, setSyncUrl, syncStatus, onManualSync, onManualLoad, onRestoreOriginal }) {
  const [urlInput, setUrlInput] = useState(syncUrl || "");

  const download = () => {
    const wb = buildWorkbook(snapshot);
    const stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `estoque-campanha-${stamp}.xlsx`);
  };

  const saveUrl = () => { setSyncUrl(urlInput.trim()); };

  const statusColor = syncStatus?.state === "ok" ? GREEN : syncStatus?.state === "error" ? RED : syncStatus?.state === "pending" ? AMBER : "#94A3B8";
  const statusLabel = syncStatus?.state === "ok" ? "Sincronizado" : syncStatus?.state === "error" ? "Falha na sincronização" : syncStatus?.state === "syncing" ? "Sincronizando..." : syncStatus?.state === "pending" ? "Alteração pendente — salvando em instantes..." : "Ainda não sincronizado";

  return (
    <div>
      <EyebrowDivider label="Dados · Backup e Sincronização" />

        <button onClick={download} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 18px", fontSize: 14, fontWeight: 700, color: "#fff", borderRadius: 8, border: "none", cursor: "pointer", background: NAVY }}>

        <div style={{ fontSize: 14, fontWeight: 700, color: NAVY, marginBottom: 6 }}>Sincronização automática entre domínios</div>
        <div style={{ fontSize: 13, color: "#64748B", marginBottom: 16, maxWidth: 640 }}>

          <span style={{ width: 8, height: 8, borderRadius: "50%", background: statusColor, display: "inline-block" }} />
          <span style={{ color: statusColor, fontWeight: 600 }}>{statusLabel}</span>
          {syncStatus?.time && <span style={{ color: "#94A3B8" }}>· última tentativa {new Date(syncStatus.time).toLocaleTimeString("pt-BR")}</span>}
        </div>
        {syncStatus?.state === "error" && syncStatus?.message && (
          <div style={{ marginTop: 10, padding: "10px 12px", background: "#FEF2F2", border: "1px solid #FEE2E2", borderRadius: 8, fontSize: 12, color: RED, fontFamily: "monospace" }}>
            Erro ao {syncStatus.phase === "salvar" ? "salvar" : "carregar"}: {syncStatus.message}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------- App shell ----------------
const NAV = [
  { key: "dashboard", label: "Dashboard Materiais", icon: "grid" },
  { key: "financeiro", label: "Dashboard Financeiro", icon: "wallet" },
  { key: "caixas", label: "Caixas", icon: "box" },
  { key: "pedidos", label: "Pedidos", icon: "filetext" },
  { key: "logistica", label: "Entrada / Saída", icon: "swap" },
  { key: "estoque", label: "Estoque", icon: "layers" },
  { key: "comites", label: "Comitês", icon: "building" },
  { key: "dados", label: "Dados / Backup", icon: "card", adminOnly: true },
];

function App() {
  const [page, setPage] = useState("dashboard");

  const baseCombos = useMemo(() => DATA.materiaisOrdem.flatMap((m) => (DATA.materiaisModelos[m] || []).map((mo) => ({
    material: m, modelo: mo, grafica: DATA.graficaMap[key(m, mo)] || DATA.graficas[0],
  }))), []);

  const seedPedidos = () => DATA.estoque
    .filter((r) => (r.pedido || 0) > 0)
    .map((r) => ({
      id: nextId(), material: r.material, modelo: r.modelo, quantidade: r.pedido,
      grafica: r.grafica, tiragem: null, previsaoEntrega: null, obs: "Pedido original (planilha)",
    }));
  const seedEntradas = () => DATA.entradas.map((r) => ({ id: nextId(), ...r, grafica: DATA.graficaMap[key(r.material, r.modelo)] || null, data: null }));
  const seedSaidas = () => DATA.saidas.map((r) => ({ id: nextId(), ...r, grafica: DATA.graficaMap[key(r.material, r.modelo)] || null }));
  const seedMontagens = () => (DATA.montagens_seed || []).map((r) => ({ id: nextId(), data: r.data, quantidade: r.quantidade }));

  const [pedidos, setPedidos] = useState(() => []);
  const [entradas, setEntradas] = useState(() => []);
  const [saidas, setSaidas] = useState(() => []);
  const [montagens, setMontagens] = useState(() => []);
  const [envios, setEnvios] = useState([]);
  const caixasTotal = montagens.reduce((a, e) => a + (Number(e.quantidade) || 0), 0);

  // ---- Auth ----
  const [isAdmin, setIsAdmin] = useState(() => { try { return sessionStorage.getItem(AUTH_SESSION_KEY) === "1"; } catch (e) { return false; } });
  const [showLogin, setShowLogin] = useState(false);
  const login = () => { setIsAdmin(true); try { sessionStorage.setItem(AUTH_SESSION_KEY, "1"); } catch (e) {} setShowLogin(false); };
  const logout = () => { setIsAdmin(false); try { sessionStorage.removeItem(AUTH_SESSION_KEY); } catch (e) {} };

  // ---- Cloud sync (Google Apps Script Web App URL) ----
  const [syncUrl, setSyncUrlState] = useState(() => {
    try {
      const storedVersion = localStorage.getItem(CONFIG_VERSION_KEY);
      if (storedVersion !== CONFIG_VERSION) {
        // Versão nova do site: descarta qualquer URL de sincronização salva localmente
        // e adota o que vier de fábrica neste arquivo (DEFAULT_SYNC_URL), evitando que
        // configurações antigas do navegador "sobrevivam" a uma limpeza intencional.
        localStorage.removeItem(SYNC_URL_KEY);
        localStorage.setItem(CONFIG_VERSION_KEY, CONFIG_VERSION);
        return DEFAULT_SYNC_URL;
      }
      return localStorage.getItem(SYNC_URL_KEY) || DEFAULT_SYNC_URL;
    } catch (e) { return DEFAULT_SYNC_URL; }
  });
  const setSyncUrl = (url) => { setSyncUrlState(url); try { if (url) localStorage.setItem(SYNC_URL_KEY, url); else localStorage.removeItem(SYNC_URL_KEY); } catch (e) {} };
  const [syncStatus, setSyncStatus] = useState(null);
  const [hydrated, setHydrated] = useState(false);

  const dedupeMovements = (list, fields) => {
    const seen = new Set();
    const out = [];
    (list || []).forEach((r) => {
      const sig = fields.map((f) => r[f]).join("|||");
      if (seen.has(sig)) return;
      seen.add(sig);
      out.push(r);
    });
    return out;
  };

  const doLoad = () => {
    if (!syncUrl) { setHydrated(true); return; }
    setSyncStatus({ state: "syncing" });
    const bustCache = syncUrl + (syncUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    fetch(bustCache, { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error(`Servidor respondeu ${r.status}`);
        return r.json();
      })
      .then((remote) => {
        if (remote && typeof remote === "object") {
          if (Array.isArray(remote.pedidos)) setPedidos(dedupeMovements(remote.pedidos.map((r) => ({ id: nextId(), ...r })), ["material", "modelo", "quantidade", "grafica", "tiragem", "obs"]));
          if (Array.isArray(remote.entradas)) setEntradas(dedupeMovements(remote.entradas.map((r) => ({ id: nextId(), ...r })), ["material", "modelo", "quantidade", "grafica", "data", "dia", "mes", "obs"]));
          if (Array.isArray(remote.saidas)) setSaidas(dedupeMovements(remote.saidas.map((r) => ({ id: nextId(), ...r })), ["material", "modelo", "quantidade", "grafica", "data", "dia", "mes", "destino"]));
          if (Array.isArray(remote.montagens)) setMontagens(remote.montagens.map((r) => ({ id: nextId(), ...r })));
          if (Array.isArray(remote.envios)) setEnvios(remote.envios.map((r) => ({ id: nextId(), ...r })));
        }
        setSyncStatus({ state: "ok", time: Date.now() });
      })
      .catch((err) => setSyncStatus({ state: "error", time: Date.now(), message: String(err && err.message || err), phase: "carregar" }))
      .finally(() => setHydrated(true));
  };

  useEffect(() => {
    doLoad();
    // eslint-disable-next-line
  }, []);

  const doSync = () => {
    if (!syncUrl) return;
    setSyncStatus({ state: "syncing" });
    const payload = { pedidos, entradas, saidas, montagens, envios, savedAt: new Date().toISOString() };
    fetch(syncUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then((r) => {
        if (!r.ok) throw new Error(`Servidor respondeu ${r.status}`);
        return r.json();
      })
      .then((res) => {
        if (res && res.ok === false) throw new Error(res.error || "Falha reportada pelo script");
        setSyncStatus({ state: "ok", time: Date.now() });
      })
      .catch((err) => setSyncStatus({ state: "error", time: Date.now(), message: String(err && err.message || err), phase: "salvar" }));
  };

  const skipFirstAutosave = useRef(true);
  useEffect(() => {
    if (!hydrated || !syncUrl) return;
    if (skipFirstAutosave.current) { skipFirstAutosave.current = false; return; }
    setSyncStatus({ state: "pending" });
    const t = setTimeout(doSync, 1500);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [pedidos, entradas, saidas, montagens, envios, hydrated, syncUrl]);

  useEffect(() => {
    if (page === "dados" && !isAdmin) setPage("dashboard");
  }, [page, isAdmin]);


  const engine = useEstoqueEngine(baseCombos, pedidos, entradas, saidas, caixasTotal);

  const totalTiragensPedidos = useMemo(() => pedidos.reduce((a, r) => {
    const preco = (DATA.precos[r.material] && DATA.precos[r.material][r.modelo]) ?? DATA.precoGenerico[r.material] ?? 0;
    return a + (r.tiragem || 0) * preco;
  }, 0), [pedidos]);

  const totalValorPedidos = useMemo(() => entradas.reduce((a, r) => {
    const preco = (DATA.precos[r.material] && DATA.precos[r.material][r.modelo]) ?? DATA.precoGenerico[r.material] ?? 0;
    return a + (r.quantidade || 0) * preco;
  }, 0), [entradas]);

  const totalValorCaixas = useMemo(() => DATA.caixas_composicao.reduce((a, c) => {
    const preco = (DATA.precos[c.material] && DATA.precos[c.material][c.modelo]) ?? DATA.precoGenerico[c.material] ?? 0;
    return a + (c.qtd_por_caixa || 0) * caixasTotal * preco;
  }, 0), [caixasTotal]);

  const saldo = DATA.orcamentoInicial - totalTiragensPedidos;

  const activeLabel = NAV.find((n) => n.key === page)?.label;

  return (
    <div style={{ minHeight: "100vh", display: "flex", background: BG }}>
      <aside className="sidebar" style={{ width: 260, flexShrink: 0, flexDirection: "column", background: NAVY }}>
        <div style={{ padding: "26px 24px", borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 36, height: 36, borderRadius: "50%", border: `2px solid ${GOLD}`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 16, color: GOLD, flexShrink: 0 }}>A</div>
            <div>
              <div style={{ color: "#fff", fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 16, lineHeight: 1.2 }}>Campanha André</div>
              <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.12em", color: GOLD }}>Controle de Estoque</div>
            </div>
          </div>
        </div>
        <nav style={{ flex: 1, padding: "16px 0", overflowY: "auto" }}>
          {NAV.filter((item) => !item.adminOnly || isAdmin).map((item) => {
            const active = page === item.key;
            return (
              <button key={item.key} className="nav-btn" onClick={() => setPage(item.key)} style={{
                color: active ? "#fff" : "rgba(255,255,255,0.65)",
                background: active ? "rgba(255,255,255,0.08)" : "transparent",
                borderLeftColor: active ? GOLD : "transparent",
              }}>
                <Icon name={item.icon} size={16} />
                <span style={{ flex: 1 }}>{item.label}</span>
                {active && <Icon name="chevron" size={14} />}
              </button>
            );
          })}
        </nav>
        <div style={{ padding: "14px 24px", borderTop: "1px solid rgba(255,255,255,0.12)" }}>
          {isAdmin ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 700, color: GOLD }}>
                <Icon name="card" size={13} color={GOLD} /> Administrador
              </span>
              <button onClick={logout} style={{ marginLeft: "auto", fontSize: 11.5, color: "rgba(255,255,255,0.6)", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>Sair</button>
            </div>
          ) : (
            <button onClick={() => setShowLogin(true)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, fontSize: 12.5, fontWeight: 700, color: "#fff", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.18)", borderRadius: 7, padding: "9px 10px", cursor: "pointer" }}>
              <Icon name="card" size={13} /> Entrar como administrador
            </button>
          )}
        </div>
        <div style={{ padding: "12px 24px 16px", fontSize: 10, color: "rgba(255,255,255,0.4)" }}>
          Dados extraídos das planilhas de campanha · Eleições 2026
        </div>
      </aside>

      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={login} />}

      <main style={{ flex: 1, minWidth: 0 }}>
        <header className="header-flex" style={{ background: "#fff", borderBottom: "1px solid #E2E8F0", padding: "20px 28px", boxShadow: "0 1px 2px rgba(0,0,0,0.03)" }}>
          <div style={{ width: "100%" }}>
            <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.14em", fontWeight: 700, color: GOLD, marginBottom: 3 }}>Painel de Logística de Campanha</div>
            <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 24, color: NAVY }}>{activeLabel}</div>
          </div>
          <div className="mobile-login">
            {isAdmin ? (
              <button onClick={logout} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, color: GOLD, background: "#FFFBEB", border: `1px solid ${GOLD}55`, borderRadius: 6, padding: "5px 9px", cursor: "pointer" }}>
                <Icon name="card" size={12} color={GOLD} /> Sair
              </button>
            ) : (
              <button onClick={() => setShowLogin(true)} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, color: NAVY, background: "#F1F5F9", border: "1px solid #E2E8F0", borderRadius: 6, padding: "5px 9px", cursor: "pointer" }}>
                <Icon name="card" size={12} /> Admin
              </button>
            )}
          </div>
          <div className="mobile-nav">
            {NAV.filter((item) => !item.adminOnly || isAdmin).map((item) => (
              <button key={item.key} onClick={() => setPage(item.key)} style={{
                fontSize: 11, padding: "5px 8px", borderRadius: 6, border: `1px solid ${page === item.key ? NAVY : "#E2E8F0"}`,
                color: page === item.key ? NAVY : "#94A3B8", background: "#fff", cursor: "pointer",
              }}>{item.label.split(" ")[0]}</button>
            ))}
          </div>
        </header>
        <div style={{ padding: "40px 28px", maxWidth: 1400 }}>
          {page === "dashboard" && <DashboardMateriais engine={engine} />}
          {page === "financeiro" && <DashboardFinanceiroPage pedidos={pedidos} entradas={entradas} saldo={saldo} totalTiragens={totalTiragensPedidos} totalPedidos={totalValorPedidos} totalCaixas={totalValorCaixas} />}
          {page === "caixas" && <CaixasPage engine={engine} montagens={montagens} setMontagens={setMontagens} envios={envios} setEnvios={setEnvios} isAdmin={isAdmin} />}
          {page === "pedidos" && <PedidosPage pedidos={pedidos} setPedidos={setPedidos} isAdmin={isAdmin} />}
          {page === "logistica" && <LogisticaPage entradas={entradas} setEntradas={setEntradas} saidas={saidas} setSaidas={setSaidas} isAdmin={isAdmin} />}
          {page === "estoque" && <EstoquePage engine={engine} />}
          {page === "comites" && <ComitesPage saidas={saidas} />}
          {page === "dados" && isAdmin && (
            <DadosPage snapshot={{ pedidos, entradas, saidas, montagens, envios }} syncUrl={syncUrl} setSyncUrl={setSyncUrl} syncStatus={syncStatus} onManualSync={doSync} onManualLoad={doLoad}
              onRestoreOriginal={() => {
                if (!confirm("Isso vai substituir TODOS os dados atuais (Pedidos, Entradas, Saídas, Caixas Montadas) pelos dados originais gravados neste arquivo do site, e enviar essa substituição para a planilha na nuvem. Não afeta Enviadas aos Correios. Continuar?")) return;
                setPedidos(seedPedidos());
                setEntradas(seedEntradas());
                setSaidas(seedSaidas());
                setMontagens(seedMontagens());
              }} />
          )}
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

document.getElementById("loading").remove();
</script>
</body>
</html>
